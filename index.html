<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        h1 {
            color: #333;
        }
    </style>
</head>
<body>
    <h1>Hello World! 🌸</h1>
    <p id="visit-tracker"></p>

    <script>
        const apiUrl = window.location.protocol === 'file:' ? 'http://localhost:3000/api/visit' : '/api/visit';
        fetch(apiUrl, { method: 'POST' })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.json();
            })
            .then(data => {
                const visitCount = data.visitCount;
                const trackerElement = document.getElementById('visit-tracker');
                if (visitCount === 1) {
                    trackerElement.textContent = 'This page has been visited 1 time.';
                } else {
                    trackerElement.textContent = `This page has been visited ${visitCount} times.`;
                }
            })
            .catch(error => {
                console.error('Error fetching visit count:', error);
                document.getElementById('visit-tracker').textContent = 'Error loading visit count.';
            });
    </script>
</body>
</html>
